[package]
name = "salesforce-template-loader"
version = "1.3.0"
edition = "2024"
description = "Salesforce template-based data loader"
license = "BSD-2-Clause"
repository = "https://github.com/RubberDuckHero/sfdl"

[[bin]]
name = "sfdl"
path = "src/main.rs"

[dependencies]
clap = { version="4", features=["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
csv = "1"
indicatif = "0.17"
tempfile = "3"
calamine = "0.34"
chrono = "0.4"